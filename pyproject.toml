[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "publicsafetyapi-mcp"
version = "0.1.0"
description = "MCP server for publicsafetyapi.dev — US police, fire, EMS & hospital data for AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PublicSafetyAPI", email = "hello@districtapi.dev" }]
requires-python = ">=3.10"
keywords = ["mcp", "public-safety", "fire", "police", "ems", "hospital", "hifld", "api"]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://publicsafetyapi.dev"
Repository = "https://github.com/public-safety-api/publicsafetyapi-mcp"

[project.scripts]
publicsafetyapi-mcp = "publicsafetyapi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/publicsafetyapi_mcp"]
